name: Release
on:
  workflow_dispatch:

jobs:
  release:
    concurrency:
      group: app-release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check release state
        id: release_state
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-release-state.mjs

      - name: Install Rust
        if: steps.release_state.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Read Release Notes
        if: steps.release_state.outputs.skip != 'true'
        id: release_notes
        run: |
          $content = node scripts/format-release-notes.mjs --raw
          echo "RELEASE_BODY<<EOF" >> $env:GITHUB_OUTPUT
          echo $content >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build Tauri (without upload)
        if: steps.release_state.outputs.skip != 'true'
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}

      - name: Create Release
        if: steps.release_state.outputs.skip != 'true'
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          name: 'snippets-code ${{ github.ref_name }}'
          body: ${{ steps.release_notes.outputs.RELEASE_BODY }}
          draft: true
          prerelease: false
          files: ''

      - name: Upload assets to release
        if: steps.release_state.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RELEASE_ID: ${{ steps.create_release.outputs.id }}
        run: node scripts/upload-assets.mjs

      - name: Generate and upload latest.json
        if: steps.release_state.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RELEASE_ID: ${{ steps.create_release.outputs.id }}
        run: node scripts/updater.mjs

      - name: Publish Release
        if: steps.release_state.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --prerelease=false --latest
